<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бошқарув панели - eco-chat.uz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo_tree.jpg" alt="Logo" class="sidebar-logo">

                <span class="sidebar-brand">@Eco234_bot</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-target="dashboard">📊 Умумий</a>
                <a href="#topics" class="nav-item" data-target="topics">📝 Тест Киритиш</a>
                <a href="#branches" class="nav-item" data-target="branches">🏢 Филиаллар</a>
            </nav>
            <div class="sidebar-footer">
                <div class="admin-info">
                    <div class="avatar">SA</div>
                    <span>Super Admin</span>
                </div>
                <button id="logoutBtn" class="btn-logout">🚪 Чиқиш</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <h1 id="pageTitle">Умумий</h1>
                <div class="live-indicator">
                    <span class="pulse-dot"></span> Jonli
                </div>
            </header>

            <!-- Dashboard Section -->
            <section id="dashboard" class="page-section active">

                <!-- Row 1: Main counters (2 cards) -->
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px;">
                    <div class="kpi-card" style="background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;border:none;">
                        <div class="kpi-icon" style="background:rgba(255,255,255,0.2);color:#fff;">👥</div>
                        <div class="kpi-info">
                            <h3 style="color:rgba(255,255,255,0.8);font-size:13px;">Жами ходимлар</h3>
                            <div class="kpi-value" id="kpi-total-employees" style="color:#fff;font-size:32px;">0</div>
                        </div>
                    </div>
                    <div class="kpi-card" style="background:linear-gradient(135deg,#166534,#16a34a);color:#fff;border:none;">
                        <div class="kpi-icon" style="background:rgba(255,255,255,0.2);color:#fff;">✅</div>
                        <div class="kpi-info">
                            <h3 style="color:rgba(255,255,255,0.8);font-size:13px;">Тестни тугатганлар</h3>
                            <div class="kpi-value" id="kpi-completed" style="color:#fff;font-size:32px;">0</div>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Per-topic stats + total -->
                <div id="topicStatsRow" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;">
                    <!-- Filled dynamically by JS -->
                    <div class="kpi-card" style="animation:pulse 1.5s infinite;opacity:0.6;"><div class="kpi-info"><h3>Юкланмоқда...</h3></div></div>
                </div>

                <!-- Employee Rating Table -->
                <div class="table-container">
                    <div class="table-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <h2 style="margin:0;font-size:18px;">📊 Ходимлар рейтинги</h2>
                        <div style="display:flex;align-items:center;gap:12px;">
                            <button onclick="Dashboard.exportToExcel()" style="display:flex;align-items:center;gap:7px;padding:8px 18px;background:linear-gradient(135deg,#166534,#16a34a);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(22,163,74,0.35);transition:all .2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='none'">
                                📥 Excel
                            </button>
                            <select id="filterTopic" style="width:160px;background-color:#fff;border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;outline:none;">
                                <option value="all">📚 Барча мавзулар</option>
                                <option value="1">1-Мавзу</option>
                                <option value="2">2-Мавзу</option>
                                <option value="3">3-Мавзу</option>
                                <option value="4">4-Мавзу</option>
                            </select>
                            <select id="filterBranch" style="width:200px;background-color:#fff;border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;outline:none;">
                                <option value="all">🏢 Барча филиаллар</option>
                            </select>
                            <select id="filterStatus" style="width:220px;background-color:#fff;border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;outline:none;">
                                <option value="all">📋 Барча ҳолатлар</option>
                                <option value="att1_done">✅ 1-уринишни бажарганлар</option>
                                <option value="att1_pending">❌ 1-уринишни бажармаганлар</option>
                                <option value="att2_done">✅ 2-уринишни бажарганлар</option>
                                <option value="att2_pending">❌ 2-уринишни бажармаганлар</option>
                            </select>
                            <select id="pageSizeSelect" style="width:110px;background-color:#fff;border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;outline:none;">
                                <option value="10">10 талик</option>
                                <option value="20" selected>20 талик</option>
                                <option value="50">50 талик</option>
                                <option value="100">100 талик</option>
                                <option value="all">Ҳаммаси</option>
                            </select>
                            <input type="text" class="form-control input-sm" placeholder="🔍 Қидириш..." id="empSearch" style="width:220px;">

                        </div>
                    </div>
                    <div style="overflow-x:auto;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                    <table id="ratingTable" style="width:100%;min-width:1400px;border-collapse:collapse;font-size:13px;">
                        <thead id="ratingTableHead"></thead>
                        <tbody id="employeesTableBody">
                            <tr><td colspan="20" style="text-align:center;padding:32px;color:#9ca3af;">Маълумот юкланмоқда...</td></tr>
                        </tbody>
                    </table>
                    </div>
                    <div id="empPagination" style="margin-top:16px;"></div>
                </div>
            </section>

            <!-- Topics Section -->
            <section id="topics" class="page-section" style="display:none;">
                <div class="section-header">
                    <h2>Мавзулар</h2>
                    <button class="btn btn-primary" onclick="Topics.showCreateModal()">+ Янги мавзу</button>
                </div>
                <div id="topicsList" class="topics-grid">
                    <!-- Topics via JS -->
                </div>
            </section>
            
            <!-- Other Sections... -->
            <section id="reports" class="page-section" style="display:none;">
                <h2>Ҳисоботлар</h2>
                <!-- Reports via JS -->
            </section>
            
            <section id="branches" class="page-section" style="display:none;">
                <h2>Филиаллар</h2>
                <!-- Branches via JS -->
            </section>
            
            <section id="audit" class="page-section" style="display:none;">
                <h2>Audit Log</h2>
                <!-- Audit via JS -->
            </section>
            
            <section id="settings" class="page-section" style="display:none;">
                <h2>Созламалар</h2>
                <!-- Settings via JS -->
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="employeeModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>Ходим маълумотлари</h3>
                <button class="close-modal">×</button>
            </div>
            <div class="modal-body" id="employeeModalBody">
                <!-- Data via JS -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sse.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/topics.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/branches.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/audit.js"></script>
    
    <script>
        // Simple router with auto init() triggers
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                document.querySelectorAll('.page-section').forEach(sec => sec.style.display = 'none');
                
                item.classList.add('active');
                const target = item.getAttribute('data-target');
                const secEl = document.getElementById(target);
                if (secEl) secEl.style.display = 'block';

                const titleText = item.textContent.replace(/[^\А-Яа-яA-Za-z\s]/g, '').trim();
                document.getElementById('pageTitle').textContent = titleText || 'Бошқарув панели';

                if (target === 'topics' && typeof Topics !== 'undefined') Topics.init();
                if (target === 'dashboard' && typeof Dashboard !== 'undefined') Dashboard.init();
                if (target === 'branches' && typeof Branches !== 'undefined') Branches.init();
                if (target === 'reports' && typeof Reports !== 'undefined') Reports.init();
                if (target === 'audit' && typeof Audit !== 'undefined') Audit.init();
            });
        });
    </script>
</body>
</html>

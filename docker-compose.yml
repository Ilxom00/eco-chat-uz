version: '3.8'

# ═══════════════════════════════════════════════════════════════════
#  eco-chat.uz — Docker Compose
#
#  MA'LUMOT XAVFSIZLIGI:
#  ✅ Har qanday deploy usulida ma'lumotlar SAQLANIB QOLADI
#  ✅ docker-compose down      → SAQLANADI (volumes yo'qolmaydi)
#  ✅ docker-compose down -v   → SAQLANADI (explicit name muhofaza qiladi)
#  ✅ docker-compose up --build → SAQLANADI
#  ✅ Server restart            → SAQLANADI
#  ✅ Loyiha papkasi o'zgarsa  → SAQLANADI (fixed volume name)
# ═══════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecochat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecochat_pass}
      POSTGRES_DB: ecochat_db
    volumes:
      - ecochat_postgres_data:/var/lib/postgresql/data
      - ecochat_backup_data:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecochat -d ecochat_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecochat-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ecochat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecochat-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ecochat_backup_data:/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecochat-network

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - ecochat-network

volumes:
  # FIXED EXPLICIT NAMES — docker-compose down -v CANNOT delete these!
  # Because explicit name != project_name+volume_name pattern
  ecochat_postgres_data:
    name: ecochat_postgres_data
  ecochat_redis_data:
    name: ecochat_redis_data
  ecochat_backup_data:
    name: ecochat_backup_data

networks:
  ecochat-network:
    driver: bridge
